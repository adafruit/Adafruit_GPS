name: Arduino Library CI

on: [pull_request, push, repository_dispatch]

jobs:
  regression-tests:
    name: All regression tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Run all tests with sanitizers
      run: python3 extras/tests/run_tests.py

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - uses: actions/checkout@v3
    - uses: actions/checkout@v3
      with:
         repository: adafruit/ci-arduino
         path: ci

    - name: pre-install
      run: bash ci/actions_install.sh

    - name: install SdFat logger example dependency
      run: |
        arduino-cli lib update-index
        arduino-cli lib install "SdFat - Adafruit Fork"

    - name: test platforms
      run: python3 ci/build_platform.py main_platforms

    - name: clang
      run: python3 ci/run-clang-format.py -e "ci/*" -e "bin/*" -r .

    - name: doxygen
      env:
        GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        PRETTYNAME : "Adafruit GPS Library"
      run: bash ci/doxy_gen_and_deploy.sh src
